[project]
name = "datamate"
version = "0.9.0"
description = "Zalo AI Challenge 2026, DataMate: Vietnamese questions over messy shop spreadsheets, answered with LLM-written DuckDB SQL"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb==2.0.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-calamine>=0.9",
    "rapidfuzz>=3.9",          # --fuzzy-hits (ingest.fuzzy_hits); without it the typo kind is skipped
]

[project.optional-dependencies]
llm = ["vllm==0.32.0"]                       # inference (the training stack lives in training/requirements.txt, its own venv)
dev = ["pytest", "ruff", "matplotlib", "nbformat", "nbconvert", "ipykernel"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datamate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W"]
# Prompt and hint text is kept verbatim (wrapping changes what the model reads). Compact one-line statements in analysis tools.
ignore = ["E501", "E701", "E702", "E731", "E741", "E401", "E402"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401"]   # one shared setup cell per notebook
